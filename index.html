<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrick's Minecraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      padding-top: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      height: 80px;
    }
    #overlay h1 {
      color: #7CFC00;
      font-size: 22px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #7CFC00;
      margin: 0;
    }
    #overlay p {
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #7CFC00;
    }
    #loading h1 {
      font-size: 28px;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #7CFC00;
      margin-bottom: 8px;
    }
    #loading p {
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
    }
    .spin {
      width: 48px; height: 48px;
      border: 6px solid #7CFC00;
      border-top-color: #ff6600;
      border-radius: 50%;
      animation: rot 0.8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Patrick's Minecraft</h1>
    <p>ASCII Adventure</p>
    <div class="spin"></div>
    <p style="margin-top:20px;color:#666">Carregando...</p>
  </div>

  <div id="overlay" style="display:none">
    <h1>Patrick's Minecraft</h1>
    <p>ASCII Adventure</p>
  </div>

  <!-- Carrega o jogo oficial em iframe (já funciona e tem som) -->
  <iframe
    id="frame"
    src="https://asciicker.com/y9/"
    allow="autoplay; fullscreen; gamepad"
    allowfullscreen
    style="display:none"
  ></iframe>

  <script>
    var frame = document.getElementById("frame");
    var loading = document.getElementById("loading");
    var overlay = document.getElementById("overlay");

    // Quando o iframe carregar, esconde o loading
    frame.onload = function() {
      setTimeout(function() {
        loading.style.display = "none";
        frame.style.display = "block";
        overlay.style.display = "block";
      }, 800);
    };

    // Timeout de segurança
    setTimeout(function() {
      if (loading.style.display !== "none") {
        loading.querySelector("p:last-child").textContent = "Quase lá...";
      }
    }, 5000);
  </script>
</body>
</html>
