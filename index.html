body {
  background: #0a0a0f !important;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
#status {
  color: #7CFC00 !important;
  font-size: 18px !important;
  font-weight: 600;
  letter-spacing: 1px;
  text-shadow: 0 0 10px #7CFC00;
  margin-top: 20px;
}
figure#spinner {
  margin-top: 15vh !important;
}
.spinner {
  height: 60px !important;
  width: 60px !important;
  border-left: 8px solid #7CFC00 !important;
  border-right: 8px solid #7CFC00 !important;
  border-bottom: 8px solid #7CFC00 !important;
  border-top: 8px solid #ff6600 !important;
  background-color: transparent !important;
  box-shadow: 0 0 20px rgba(124, 252, 0, 0.4);
}
#progress {
  width: 280px;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  background: #222;
  accent-color: #7CFC00;
}
.game-title {
  color: #7CFC00;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #7CFC00, 0 0 30px #7CFC00;
  margin-bottom: 8px;
  font-family: monospace;
}
.game-subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

</style>
<script>
document.getElementById("start-overlay").addEventListener("click", function() {
  this.style.display = "none";
  // Unlock audio (required by Chrome / Chromebook)
  if (typeof audioResume === "function") audioResume();
  // Also try creating a silent AudioContext if needed
  try {
    if (!window.audio_ctx) {
      window.audio_ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (window.audio_ctx.state === "suspended") window.audio_ctx.resume();
  } catch(e) {}
}, {once: true});
</script>
