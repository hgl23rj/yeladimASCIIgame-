<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrick's Minecraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      padding-top: 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      height: 70px;
    }
    #overlay h1 {
      color: #7CFC00;
      font-size: 20px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #7CFC00;
      margin: 0;
    }
    #overlay p {
      color: #999;
      font-size: 11px;
      letter-spacing: 1px;
      margin-top: 3px;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #7CFC00;
    }
    #loading h1 {
      font-size: 28px;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #7CFC00;
      margin-bottom: 8px;
    }
    #loading p { color: #888; font-size: 13px; margin-bottom: 24px; }
    .spin {
      width: 48px; height: 48px;
      border: 6px solid #7CFC00;
      border-top-color: #ff6600;
      border-radius: 50%;
      animation: rot 0.8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    #hint {
      position: fixed;
      bottom: 16px; left: 0; right: 0;
      text-align: center;
      z-index: 15;
      pointer-events: none;
      color: #7CFC00;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #000;
      opacity: 0.9;
      transition: opacity 0.5s;
    }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Patrick's Minecraft</h1>
    <p>ASCII Adventure</p>
    <div class="spin"></div>
    <p style="margin-top:20px;color:#666">Carregando...</p>
  </div>

  <div id="overlay" style="display:none">
    <h1>Patrick's Minecraft</h1>
    <p>WASD = andar &nbsp;|&nbsp; Mouse = olhar &nbsp;|&nbsp; Espaço = pular &nbsp;|&nbsp; Q/E = girar</p>
  </div>

  <div id="hint" style="display:none">
    Clique dentro do jogo para ativar o teclado
  </div>

  <iframe
    id="frame"
    src="https://asciicker.com/y9/"
    allow="autoplay; fullscreen; gamepad; keyboard-map"
    allowfullscreen
    tabindex="0"
    style="display:none"
  ></iframe>

  <script>
    var frame = document.getElementById("frame");
    var loading = document.getElementById("loading");
    var overlay = document.getElementById("overlay");
    var hint = document.getElementById("hint");

    function focusGame() {
      try {
        frame.focus();
        // Tenta focar o conteúdo interno também
        if (frame.contentWindow) {
          frame.contentWindow.focus();
        }
      } catch (e) {}
    }

    frame.onload = function() {
      setTimeout(function() {
        loading.style.display = "none";
        frame.style.display = "block";
        overlay.style.display = "block";
        hint.style.display = "block";
        focusGame();

        // Esconde a dica depois de alguns segundos
        setTimeout(function() {
          hint.classList.add("hide");
        }, 5000);
      }, 600);
    };

    // Sempre que clicar na página, foca o iframe
    document.addEventListener("click", function() {
      focusGame();
      hint.classList.add("hide");
    });

    document.addEventListener("touchstart", function() {
      focusGame();
      hint.classList.add("hide");
    }, {passive: true});

    // Encaminha teclas para o iframe quando possível
    window.addEventListener("keydown", function(e) {
      focusGame();
    });

    // Timeout de segurança
    setTimeout(function() {
      if (loading.style.display !== "none") {
        var p = loading.querySelector("p:last-child");
        if (p) p.textContent = "Ainda carregando, aguarde...";
      }
    }, 6000);
  </script>
</body>
</html>
